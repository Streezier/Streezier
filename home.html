<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop · Streezier</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#17153b;--indigo:#4f46e5;--violet:#7c3aed;--coral:#ff5a5f;--sun:#ffc933;--mint:#12b886;--sky:#2b8cff;--bg:#f4f3ff;--ink:#1c1a3a;--muted:#6b6a8a}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 Outfit,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3{margin:0;line-height:1.1;font-weight:800}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header{background:var(--navy);position:sticky;top:0;z-index:5;box-shadow:0 4px 20px #17153b33}
header .wrap{display:flex;align-items:center;gap:12px;height:68px}
.logo{font-size:1.6rem;font-weight:800;color:#fff;margin-right:auto}
.logo b{color:var(--sun)}
nav{display:flex;gap:6px}
nav a{color:#cfcdf5;font-weight:600;padding:8px 16px;border-radius:99px}
nav a:hover{background:#ffffff1a;color:#fff}
nav a.on{background:var(--indigo);color:#fff}
.badge{background:var(--coral);color:#fff;border-radius:99px;font-size:.75rem;padding:2px 8px;margin-left:6px}
.hero{background:linear-gradient(135deg,var(--navy),var(--indigo) 60%,var(--violet));color:#fff;padding:64px 0 90px}
.hero h1{font-size:clamp(2.4rem,6vw,4.2rem);max-width:14ch}
.hero p{max-width:46ch;color:#dcd9ff;font-size:1.15rem;margin:16px 0 26px}
.btn{display:inline-block;background:var(--coral);color:#fff;border:0;border-radius:12px;padding:12px 24px;font:700 1rem Outfit,sans-serif;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px #ff5a5f55}
.btn.sun{background:var(--sun);color:var(--navy)}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:-50px;position:relative}
.cat-card{border:0;border-radius:16px;padding:22px;color:#fff;text-align:left;cursor:pointer;font:inherit;box-shadow:0 10px 24px #17153b33}
.cat-card span{font-size:2.4rem;display:block}.cat-card h3{font-size:1.4rem;margin-top:6px}.cat-card small{opacity:.9}
.c-Home{background:linear-gradient(135deg,#ff8a3d,#ff5a5f)}.c-Kitchen{background:linear-gradient(135deg,#12b886,#0ca678 40%,#2b8cff)}.c-Vehicle{background:linear-gradient(135deg,#2b8cff,#7c3aed)}
.strip{display:flex;justify-content:space-around;gap:16px;flex-wrap:wrap;background:#fff;border-radius:14px;padding:16px;margin:28px 0;font-weight:600;box-shadow:0 4px 14px #4f46e51a}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 20px;align-items:center}
.filters h2{margin-right:auto;font-size:1.9rem}
.chip{border:2px solid #d9d6ff;background:#fff;color:var(--ink);border-radius:99px;padding:6px 18px;cursor:pointer;font:600 1rem Outfit,sans-serif}
.chip.on{background:var(--indigo);border-color:var(--indigo);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:22px;padding-bottom:60px}
.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 16px #4f46e51a;display:flex;flex-direction:column;position:relative;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 30px #4f46e533}
.thumb{height:170px;display:grid;place-items:center;font-size:4.2rem}
.sale{position:absolute;top:12px;left:12px;background:var(--coral);color:#fff;font-weight:700;font-size:.8rem;padding:3px 10px;border-radius:99px}
.body{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.tag{align-self:flex-start;font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:99px}
.t-Home{background:#ffe8d6;color:#d9480f}.t-Kitchen{background:#d3f9e8;color:#087f5b}.t-Vehicle{background:#dbe9ff;color:#1c5fd4}
.body h3{font-size:1.15rem}
.price{font-size:1.25rem;font-weight:800;color:var(--indigo);margin-top:auto}.price s{color:var(--muted);font-weight:400;font-size:.95rem;margin-left:6px}
.card .btn{width:100%;margin-top:8px;background:var(--indigo)}
.card .btn:hover{box-shadow:0 8px 18px #4f46e555}
.banner{background:linear-gradient(135deg,var(--navy),var(--indigo));color:#fff;padding:40px 0}
.banner h2{font-size:2.4rem}
.cols{display:grid;grid-template-columns:1.7fr 1fr;gap:26px;padding:32px 0 60px}
.panel{background:#fff;border-radius:18px;padding:22px;box-shadow:0 4px 16px #4f46e51a}
.panel h3{margin-bottom:10px}
.row{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid #ecebff;flex-wrap:wrap}
.row:last-child{border:0}.row .thumb{height:68px;width:68px;font-size:2rem;border-radius:14px;flex:none}
.info{flex:1;min-width:140px}.info span{color:var(--muted);font-size:.9rem}
.qty{display:flex;align-items:center;gap:10px;font-weight:700}
.qty button{width:32px;height:32px;border-radius:10px;border:0;background:#e9e7ff;color:var(--indigo);font-size:1.1rem;font-weight:700;cursor:pointer}
.qty button:hover{background:var(--indigo);color:#fff}
.link{background:none;border:0;color:var(--coral);cursor:pointer;font:600 .95rem Outfit,sans-serif}
.sum{display:flex;justify-content:space-between;padding:6px 0}
.sum.total{font-weight:800;font-size:1.35rem;border-top:2px dashed #d9d6ff;margin-top:10px;padding-top:14px}
.free{color:var(--mint);font-weight:700}
.empty{text-align:center;padding:36px 0;color:var(--muted)}
label{display:block;font-weight:600;margin:14px 0 4px}
input{width:100%;padding:11px 14px;border:2px solid #e1dfff;border-radius:12px;background:#faf9ff;font:inherit;color:var(--ink)}
input:focus{border-color:var(--indigo);outline:0}
.msg{color:var(--mint);font-weight:700;margin-left:14px}
.avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--sun),var(--coral));display:grid;place-items:center;font-size:2rem;margin-bottom:8px}
footer{background:var(--navy);color:#b9b7e6;padding:28px 0;font-size:.95rem;text-align:center}
@media(max-width:760px){.cols{grid-template-columns:1fr}.cats{grid-template-columns:1fr}.hero{padding-bottom:70px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
header .wrap{height:auto;min-height:68px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.logo{margin-right:0}
.sform{flex:1;display:flex;min-width:220px;max-width:620px;margin:0 auto}
.sform input{border:0;border-radius:12px 0 0 12px;background:#fff;padding:12px 16px}
.sform button{border:0;background:var(--sun);color:var(--navy);font:700 1rem Outfit,sans-serif;padding:0 22px;border-radius:0 12px 12px 0;cursor:pointer}
.sform button:hover{background:#ffd75e}
@media(max-width:760px){.sform{order:3;flex-basis:100%;max-width:none}nav{margin-left:auto}}
.catbar{display:flex;gap:14px;overflow-x:auto;padding:18px 0;scrollbar-width:none}
.catbar button{flex:none;border:0;background:none;cursor:pointer;font:600 .95rem Outfit,sans-serif;color:var(--ink);text-align:center}
.catbar i{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;font-size:1.8rem;font-style:normal;margin:0 auto 4px;border:3px solid transparent}
.catbar .on i{border-color:var(--indigo)}
.deal{background:linear-gradient(120deg,var(--coral),#ff9a3d 60%,var(--sun));color:#fff;border-radius:18px;padding:30px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.deal h2{font-size:clamp(1.6rem,4vw,2.4rem)}.deal p{margin:6px 0 0;font-weight:600}
.deal .btn{background:var(--navy)}
.shop{display:grid;grid-template-columns:220px 1fr;gap:24px;padding:24px 0 60px}
.side{background:#fff;border-radius:16px;padding:18px;align-self:start;box-shadow:0 4px 16px #4f46e51a}
.side h3{font-size:1.05rem;margin:0 0 8px}.side h3:not(:first-child){margin-top:18px}
.side label{display:flex;gap:8px;align-items:center;font-weight:500;margin:6px 0;cursor:pointer}
.side input{width:auto}
select{width:100%;padding:10px;border:2px solid #e1dfff;border-radius:10px;font:inherit;background:#faf9ff}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.stars{color:#f5a300;font-size:.95rem}.stars span{color:var(--muted);margin-left:4px}
.off{color:var(--coral);font-weight:700;font-size:.9rem;margin-left:6px}
.del{font-size:.85rem;color:var(--mint);font-weight:600}
.two{display:flex;gap:8px;margin-top:8px}.two .btn{margin:0;padding:10px 6px;font-size:.92rem}
.card .two .btn:first-child{background:var(--sun);color:var(--navy)}
.card .two .btn:last-child{background:var(--coral)}
.about{max-width:62ch}.about h2{font-size:2rem;margin:48px 0 12px}.about p{color:var(--muted);font-size:1.05rem}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:18px 0}
.steps .panel span{font-size:2rem}.steps h3{margin:6px 0}.steps p{margin:0;color:var(--muted)}
.why{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0 60px}
@media(max-width:760px){.shop{grid-template-columns:1fr}.steps,.why{grid-template-columns:1fr}}
.statband{background:linear-gradient(135deg,var(--navy),var(--indigo));color:#fff;border-radius:18px;padding:28px;display:flex;justify-content:space-around;gap:20px;flex-wrap:wrap;text-align:center;margin:10px 0 0}
.statband b{display:block;font-size:2.4rem;color:var(--sun);font-weight:800}
.cta{text-align:center;padding:40px 0 64px}.cta h2{font-size:2rem;margin-bottom:16px}
.about p+p{margin-top:14px}
.sorts{display:flex;gap:8px;flex-wrap:wrap}
.thumb img,.dimg img{width:100%;height:100%;object-fit:cover}
a.card{color:inherit}
.thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}.thumbs img{width:78px;height:78px;object-fit:cover;border-radius:10px;border:2px solid #e1dfff;cursor:pointer}.thumbs img:hover{border-color:var(--indigo)}
.mrp{color:var(--muted);text-decoration:line-through;font-weight:400;font-size:.95rem;margin-left:6px}
.back{display:inline-block;margin:6px 0 16px;color:var(--indigo);font-weight:700}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:30px;background:#fff;border-radius:18px;padding:24px;box-shadow:0 4px 16px #4f46e51a;margin-bottom:60px}
.dimg{border-radius:16px;overflow:hidden;min-height:340px;display:grid;place-items:center;font-size:8rem}
.detail h1{font-size:clamp(1.6rem,3vw,2.2rem);margin:10px 0}
.dprice{font-size:2.1rem;font-weight:800;color:var(--indigo);margin:12px 0 4px}
.detail ul{padding-left:20px;color:var(--muted)}
.detail .two .btn{padding:14px;font-size:1.05rem;flex:1}
.detail .two .btn:first-child{background:var(--sun);color:var(--navy)}
.detail .two .btn:last-child{background:var(--coral)}
@media(max-width:760px){.detail{grid-template-columns:1fr}}
button.back{background:none;border:0;cursor:pointer;font:700 1rem Outfit,sans-serif;padding:0}
.card[data-open]{cursor:pointer}
footer a{color:#fff;text-decoration:underline}
</style></head><body>
<header><div class="wrap"><a class="logo" href="index.html">Streez<b>ier</b></a>
<form class="sform" id="sform" role="search"><input id="q" type="search" placeholder="Search for kitchen, home or car accessories" aria-label="Search products"><button type="submit">Search</button></form>
<nav><a href="index.html">About</a><a href="home.html" class="on">Home</a><a href="profile.html">Profile</a><a href="cart.html">🛒<span class="badge" id="count" hidden>0</span></a></nav></div></header>
<main class="wrap">
<div id="listView">
<div class="catbar"><button data-f="All" onclick="setCat('All')"><i style="background:#e9e7ff">🛍️</i>All</button><button data-f="Home" onclick="setCat('Home')"><i style="background:#ffe8d6">🏠</i>Home</button><button data-f="Kitchen" onclick="setCat('Kitchen')"><i style="background:#d3f9e8">🍳</i>Kitchen</button><button data-f="Vehicle" onclick="setCat('Vehicle')"><i style="background:#dbe9ff">🚗</i>Vehicle</button></div>
<div class="head"><h2 id="res" style="font-size:1.3rem"></h2><div class="sorts"><button class="chip" data-s="lo" onclick="setSort('lo')">Price: Low to High</button><button class="chip" data-s="hi" onclick="setSort('hi')">Price: High to Low</button></div></div>
<div class="grid" id="grid"></div>
</div>
<div id="detailView" hidden></div>
</main>
<footer><div class="wrap">© Streezier · Free shipping over Rs. 1499 · 7-day returns · 1000+ orders every month · support.streezier@gmail.com<br><a href="privacy.html">Privacy Policy</a> · <a href="returns.html">Returns &amp; Refunds</a></div></footer>
<script>
/* ============ HOW TO ADD ANOTHER PRODUCT ============
   Copy the whole product block below (from { to },) and paste it right after it.
   Change: id (unique number), name, category ("Home", "Kitchen" or "Vehicle"), price,
   images (file names inside the "images" folder), description and highlights.
   mrp = original price (optional, shows a discount; delete the line if not needed).
======================================================= */
const PRODUCTS=[
{
 id:1,
 name:"Night Light Galaxy Projector Starry Sky Projector 360 Rotate Planetarium Lamp For Kids Bedroom Valentines Day Gift Wedding Deco",
 category:"Home",
 price:4999,
 images:["images/night_galaxy_light_1.jpg","images/night_galaxy_light_2.jpg","images/night_galaxy_light_3.jpg"],
 emoji:"🌌",
 bg:"linear-gradient(135deg,#1e1b4b,#4f46e5)",
 description:"Turn any room into a magical night sky. This Galaxy Projector Night Light fills your walls and ceiling with a soft glow of stars and colorful nebula lights, and its 360° rotation keeps the scene gently moving. It makes a calming bedtime companion for kids' bedrooms, a relaxing mood light for your own space, and a thoughtful gift for Valentine's Day, birthdays and weddings. It also works beautifully as a decoration for parties and special occasions.",
 highlights:["360° rotating starry sky and galaxy projection","Creates a calm, dreamy planetarium feel at home","Perfect for kids' bedrooms and bedtime","Great gift for Valentine's Day, weddings and birthdays","Doubles as stylish room and event decoration"]
},
{
 id:2,
 name:"Electric Fruit Peeler Machine, USB Rechargeable Automatic Peeler for Garlic, Grapes, Cherry Tomatoes, Plums & Small Fruits, T4",
 category:"Kitchen",
 price:699,
 images:["images/fruit_peeler_1.jpg","images/fruit_peeler_2.jpg","images/fruit_peeler_3.jpg"],
 emoji:"🍇",
 bg:"linear-gradient(135deg,#e5dbff,#c4b0ff)",
 description:"Peel small fruits and vegetables without the slow, sticky work. This USB rechargeable electric peeler is made for garlic, grapes, cherry tomatoes, plums and other small fruits, so you can get your ingredients ready faster. Being cordless and rechargeable, it is easy to use anywhere in the kitchen and simple to store when you are done.",
 highlights:["Automatic electric peeling, so no more peeling by hand","USB rechargeable and cordless","Made for garlic, grapes, cherry tomatoes, plums and small fruits","Saves time when cooking and meal prep","Compact and easy to store"]
},
{
 id:3,
 name:"ABS Plastic Solid Hand Pressure Vegetable Chopper",
 category:"Kitchen",
 price:299,
 images:["images/vegetablechopper_1.jpg","images/vegetablechopper_2.jpg","images/vegetablechopper_3.jpg"],
 emoji:"🥕",
 bg:"linear-gradient(135deg,#d3f9e8,#96f2d0)",
 description:"Chop vegetables quickly with a simple press of your hand. This hand pressure vegetable chopper needs no electricity, which makes it easy to use every day for onions, tomatoes and other vegetables. The solid ABS plastic body is built for regular kitchen use, and the design keeps chopping neat and simple.",
 highlights:["Hand pressure operation, no electricity or batteries needed","Solid ABS plastic body","Chops vegetables quickly and saves cooking time","Easy to use and easy to store","Affordable everyday kitchen helper"]
},
{
 id:4,
 name:"Plastic Tire Pen Holder (Black)",
 category:"Home",
 price:379,
 images:["images/penholder_1.jpg","images/penholder_2.jpg","images/penholder_3.jpg"],
 emoji:"🖊️",
 bg:"linear-gradient(135deg,#e9ecef,#adb5bd)",
 description:"Keep your desk neat with this fun tire-shaped pen holder. Made of plastic in a classic black finish, it holds your pens, pencils and small stationery in one place and adds a sporty, car-inspired look to your study table, office desk or workspace. It also makes a great small gift for anyone who loves cars.",
 highlights:["Stylish tire design in black","Holds pens, pencils and small stationery","Keeps your desk tidy and organized","Great for home, office, study table or kids' room","A fun gift for car lovers"]
},
{
 id:5,
 name:"Cotton 3 Pcs Set Roti Box Storage Basket With Lid (Beige-White)",
 category:"Kitchen",
 price:399,
 images:["images/storagebasket_1.jpg","images/storagebasket_2.jpg"],
 emoji:"🧺",
 bg:"linear-gradient(135deg,#fff3e0,#f1dcc0)",
 description:"Store rotis and other kitchen items neatly with this set of 3 cotton baskets with lids. The soft beige-white cotton design looks lovely on your kitchen counter or dining table, and the lids keep what is inside covered. Use them for rotis and chapatis, snacks, fruits or small household items, and enjoy a tidier, more stylish kitchen.",
 highlights:["Set of 3 cotton baskets with lids","Beige-white color that suits any kitchen","Great for storing rotis, chapatis and snacks","Can also hold fruits and small household items","Looks good on the counter or dining table"]
}
];
/* ====================== END OF PRODUCTS ====================== */

/* If a photo is not found, try other common file names (.jpeg, .png, .webp, capital letters,
   a doubled .jpg.jpg, or the main folder) before showing the emoji instead. */
const EXTS=["jpg","jpeg","png","webp","JPG","JPEG","PNG"];
function photoVariants(src){
 const m=src.match(/^(.*\/)?([^\/]+?)(\.[A-Za-z0-9]+)?$/),dir=m[1]||"",base=m[2],out=[];
 [dir,""].forEach(d=>EXTS.forEach(e=>{const v=d+base+"."+e;if(v!==src&&!out.includes(v))out.push(v)}));
 out.push(src+".jpg",src+".png");
 return out;
}
window.imgFail=function(img,emoji){
 const orig=img.dataset.orig||(img.dataset.orig=img.getAttribute("src")),i=+(img.dataset.i||0),v=photoVariants(orig);
 if(i<v.length){img.dataset.i=i+1;img.src=v[i]}else img.replaceWith(emoji);
};
const $=s=>document.querySelector(s);
const money=n=>"Rs. "+Number(n).toLocaleString("en-IN");
const imgs=p=>p.images||(p.image?[p.image]:[]);
const pic=(u,p)=>`<img src="${u}" alt="${p.name}" onerror="imgFail(this,'${p.emoji}')">`;
const media=p=>imgs(p)[0]?pic(imgs(p)[0],p):p.emoji;
const S={q:"",c:"All",sort:""};let CUR=null;
const KEY="streezier_cart";
let cart={};try{cart=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
function saveCart(){try{localStorage.setItem(KEY,JSON.stringify(cart))}catch(e){}count()}
function count(){const n=Object.values(cart).reduce((a,b)=>a+b.qty,0),b=$("#count");b.textContent=n;b.hidden=!n}
function addToCart(id){
 const p=PRODUCTS.find(x=>x.id==id);
 cart[id]=cart[id]||{id:p.id,name:p.name,price:p.price,image:imgs(p)[0]||"",emoji:p.emoji,bg:p.bg,qty:0};
 cart[id].qty++;saveCart();
}
function setCat(c){S.c=c;CUR=null;route()}
function setSort(s){S.sort=S.sort==s?"":s;renderList()}
function renderList(){
 let l=PRODUCTS.filter(p=>(S.c=="All"||p.category==S.c)&&(p.name+" "+p.category).toLowerCase().includes(S.q.toLowerCase()));
 if(S.sort=="lo")l.sort((a,b)=>a.price-b.price);
 if(S.sort=="hi")l.sort((a,b)=>b.price-a.price);
 $("#res").textContent=`${l.length} product${l.length==1?"":"s"}`+(S.q?` for "${S.q}"`:"")+(S.c!="All"?` in ${S.c}`:"");
 $("#grid").innerHTML=l.length?l.map(p=>`<div class="card" tabindex="0" role="link" data-open="${p.id}">${p.mrp?`<span class="sale">-${Math.round(100-p.price/p.mrp*100)}%</span>`:""}<div class="thumb" style="background:${p.bg}">${media(p)}</div><div class="body"><span class="tag t-${p.category}">${p.category}</span><h3>${p.name}</h3><div class="price">${money(p.price)}${p.mrp?`<span class="mrp">${money(p.mrp)}</span>`:""}</div></div></div>`).join(""):`<div class="empty" style="grid-column:1/-1">🔍<br>No products to show right now. Try another word or category.</div>`;
 document.querySelectorAll("[data-f]").forEach(b=>b.classList.toggle("on",b.dataset.f==S.c));
 document.querySelectorAll("[data-s]").forEach(b=>b.classList.toggle("on",b.dataset.s==S.sort));
}
function showDetail(p){
 $("#detailView").innerHTML=`<button class="back" data-back>← Back to products</button><div class="detail"><div><div class="dimg" id="mainImg" style="background:${p.bg}">${media(p)}</div>${imgs(p).length>1?`<div class="thumbs">${imgs(p).map((u,i)=>`<img src="${u}" alt="Photo ${i+1}" data-pic="${u}" onerror="imgFail(this,'')">`).join("")}</div>`:""}</div><div><span class="tag t-${p.category}">${p.category}</span><h1>${p.name}</h1><div class="dprice">${money(p.price)}${p.mrp?`<span class="mrp">${money(p.mrp)}</span><span class="off">${Math.round(100-p.price/p.mrp*100)}% off</span>`:""}</div><div class="del">Free shipping over Rs. 1499. Shipping cost depends on your area.</div><p>${p.description}</p><ul>${(p.highlights||[]).map(h=>`<li>${h}</li>`).join("")}</ul><div class="two"><button class="btn" data-add="${p.id}">Add to cart</button><button class="btn" data-buy="${p.id}">Buy now</button></div></div></div>`;
}
function route(){
 const p=CUR!==null&&PRODUCTS.find(x=>String(x.id)===String(CUR));
 $("#listView").hidden=!!p;$("#detailView").hidden=!p;
 p?showDetail(p):renderList();
 window.scrollTo(0,0);
}
$("#sform").onsubmit=e=>{e.preventDefault();S.q=$("#q").value.trim();CUR=null;route()};
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-open],[data-add],[data-buy],[data-back],[data-pic]");if(!t)return;
 const d=t.dataset;
 if(d.pic!==undefined){const p=PRODUCTS.find(x=>String(x.id)===String(CUR));$("#mainImg").innerHTML=pic(d.pic,p)}
 else if(d.open!==undefined){CUR=d.open;route()}
 else if(d.back!==undefined){CUR=null;route()}
 else if(d.add!==undefined){addToCart(d.add);t.textContent="Added to cart ✓";setTimeout(()=>t.textContent="Add to cart",1200)}
 else if(d.buy!==undefined){addToCart(d.buy);location.href="cart.html"}
});
document.addEventListener("keydown",e=>{const t=e.target.closest&&e.target.closest("[data-open]");if(t&&e.key=="Enter"){CUR=t.dataset.open;route()}});
const u=new URLSearchParams(location.search);S.q=u.get("q")||"";S.c=["Home","Kitchen","Vehicle"].includes(u.get("c"))?u.get("c"):"All";$("#q").value=S.q;
count();route();
</script></body></html>
