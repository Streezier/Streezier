<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop · Streezier</title>
<meta name="description" content="Streezier is a luxury brand. We trust quality nothing more.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23ffd60a'/%3E%3Ctext x='32' y='48' font-size='46' font-weight='900' text-anchor='middle' font-family='Arial' fill='%230a0a0a'%3ES%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--black:#0a0a0a;--yellow:#ffd60a;--grey:#f4f4f2;--line:#e3e3df;--muted:#6b6b66;--red:#c62828;--green:#1b7f3b}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 Inter,system-ui,sans-serif;background:#fff;color:var(--black)}
h1,h2,h3,.logo,.btn,.chip,nav a,.num{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em}
h1,h2,h3{margin:0;line-height:1;font-weight:800}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
header{background:var(--black);position:sticky;top:0;z-index:9}
header .wrap{display:flex;align-items:center;gap:14px;min-height:70px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.logo{font-size:2rem;font-weight:800;font-style:italic;color:#fff;position:relative;padding-bottom:2px}
.logo:after{content:"";position:absolute;left:0;right:30%;bottom:-2px;height:4px;background:var(--yellow);transform:skewX(-20deg)}
.sform{flex:1;display:flex;min-width:200px;max-width:560px;margin:0 auto}
.sform input{border:0;border-radius:0;background:#fff;padding:11px 14px;color:var(--black)}

.sform button:hover{background:#fff}
nav{display:flex;gap:4px;align-items:center}

.badge{background:var(--yellow);color:var(--black);font:700 .75rem Inter,sans-serif;padding:1px 7px;margin-left:5px}
@media(max-width:760px){.sform{order:3;flex-basis:100%;max-width:none}nav{margin-left:auto}}
.btn{display:inline-block;background:var(--yellow);color:var(--black);border:2px solid var(--black);padding:12px 28px;font-weight:800;font-size:1.1rem;cursor:pointer;transition:.15s}
.btn:hover{background:var(--black);color:var(--yellow)}
.btn.dark{background:var(--black);color:var(--yellow)}.btn.dark:hover{background:var(--yellow);color:var(--black)}
.btn.ghost{background:transparent;color:#fff;border-color:#fff}.btn.ghost:hover{background:#fff;color:var(--black)}
.btn:disabled{opacity:.6;cursor:wait}
.hero{background:var(--black);color:#fff;position:relative;overflow:hidden;padding:96px 0 110px}
.hero:after{content:"";position:absolute;right:-6%;top:0;bottom:0;width:34%;background:var(--yellow);transform:skewX(-14deg)}
.hero .wrap{position:relative;z-index:2}
.hero h1{font-size:clamp(3.2rem,10vw,7rem);max-width:9ch;line-height:.92}.hero h1 span,.y{color:var(--yellow)}
.hero p{max-width:44ch;font-size:1.15rem;color:#ddd;margin:22px 0 30px}
.hero .btn+.btn{margin-left:10px}
.strip{background:var(--yellow);font:800 1.1rem "Barlow Condensed",Arial,sans-serif;text-transform:uppercase;text-align:center;padding:14px 20px;letter-spacing:.06em}
.sec{padding:76px 0}.sec.grey{background:var(--grey)}.sec.dark{background:var(--black);color:#fff}
.sec h2.t{font-size:clamp(2.2rem,5vw,3.6rem);margin-bottom:28px}
.sec h2.t:after{content:"";display:block;width:70px;height:7px;background:var(--yellow);margin-top:14px}
.story{max-width:68ch}.story p{font-size:1.08rem;margin:0 0 16px;color:#2a2a28}
.vals,.steps,.why{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.val,.step,.pbox{background:#fff;border:2px solid var(--black);padding:26px}
.val h3,.step h3{font-size:1.7rem;margin:12px 0 8px}.val p,.step p,.pbox p{margin:0;color:#444}
.num{display:inline-block;background:var(--yellow);font-size:2.4rem;font-weight:800;padding:0 12px;line-height:1.1}
.pbox h3{font-size:1.5rem;margin-bottom:8px}
.dark .pbox{background:#161616;border-color:var(--yellow)}.dark .pbox p{color:#ccc}.dark .pbox h3{color:var(--yellow)}
.cta{background:var(--yellow);text-align:center;padding:70px 0}.cta h2{font-size:clamp(2.2rem,6vw,4rem);margin-bottom:22px}
@media(max-width:760px){.vals,.steps,.why{grid-template-columns:1fr}.hero:after{width:12%}.hero .btn+.btn{margin:10px 0 0}}
.pagehead{padding:44px 0 6px}.pagehead h1{font-size:clamp(2.6rem,7vw,4.4rem)}.pagehead p{margin:8px 0 0;color:var(--muted)}
.catbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.chip{border:2px solid var(--black);background:#fff;color:var(--black);padding:6px 18px;font-weight:700;font-size:1.05rem;cursor:pointer}
.chip.on,.chip:hover{background:var(--black);color:var(--yellow)}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 20px}
.head h2{font-size:1.5rem}.sorts{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px;padding-bottom:70px}
.card{background:#fff;border:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;position:relative;transition:.2s}
.card:hover{border-color:var(--black);transform:translateY(-4px);box-shadow:8px 8px 0 var(--yellow)}
.thumb{height:250px;display:grid;place-items:center;font-size:4.5rem;background:var(--grey);overflow:hidden}
.thumb img,.dimg img{width:100%;height:100%;object-fit:cover}
.sale{position:absolute;top:0;left:0;background:var(--black);color:var(--yellow);font:800 1rem "Barlow Condensed",Arial,sans-serif;padding:4px 12px;z-index:1}
.body{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.tag{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.card h3{font:600 1rem/1.35 Inter,sans-serif;text-transform:none;letter-spacing:0}
.price{font-weight:800;font-size:1.2rem;margin-top:auto}
.mrp{color:var(--muted);text-decoration:line-through;font-weight:400;font-size:.95rem;margin-left:8px}
.off{color:var(--green);font-weight:700;font-size:.95rem;margin-left:8px}
.back{background:none;border:0;cursor:pointer;font:800 1.1rem "Barlow Condensed",Arial,sans-serif;text-transform:uppercase;margin:24px 0 14px;padding:0}.back:hover{color:#8a7400}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-bottom:70px}
.dimg{min-height:380px;aspect-ratio:1;display:grid;place-items:center;font-size:8rem;background:var(--grey);overflow:hidden}
.thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.thumbs img{width:80px;height:80px;object-fit:cover;border:2px solid var(--line);cursor:pointer}.thumbs img:hover{border-color:var(--black)}
.detail h1{font-size:clamp(1.8rem,3.4vw,2.6rem);margin:10px 0 14px;line-height:1.05}
.dprice{font-size:2.2rem;font-weight:800;margin:6px 0}
.del{font-size:.9rem;color:var(--muted);margin-bottom:12px}
.detail p{color:#333}.detail ul{padding-left:20px;color:#333}
.two{display:flex;gap:10px;margin-top:18px}.two .btn{flex:1;text-align:center}.two .btn:last-child{background:var(--black);color:var(--yellow)}.two .btn:last-child:hover{background:var(--yellow);color:var(--black)}
@media(max-width:760px){.detail{grid-template-columns:1fr}}
.banner{background:var(--black);color:#fff;padding:46px 0;border-bottom:6px solid var(--yellow)}
.banner h2{font-size:clamp(2.4rem,6vw,3.6rem)}.banner p{margin:8px 0 0;color:#ccc}
.bwrap{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.avatar{width:70px;height:70px;background:var(--yellow);color:var(--black);display:grid;place-items:center;font:800 2.2rem "Barlow Condensed",Arial,sans-serif;margin-bottom:10px}
.cols{display:grid;grid-template-columns:1.7fr 1fr;gap:26px;padding:34px 0 70px}
.panel{background:#fff;border:2px solid var(--black);padding:22px}.panel h3{font-size:1.5rem;margin-bottom:10px}
.row{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.row:last-child{border:0}
.row .thumb{height:72px;width:72px;font-size:2rem;flex:none}
.info{flex:1;min-width:140px}.info span{color:var(--muted);font-size:.9rem}
.qty{display:flex;align-items:center;gap:10px;font-weight:700}
.qty button{width:32px;height:32px;border:2px solid var(--black);background:#fff;font-weight:800;cursor:pointer}.qty button:hover{background:var(--yellow)}
.link{background:none;border:0;color:var(--red);cursor:pointer;font:600 .95rem Inter,sans-serif;text-decoration:underline}
.sum{display:flex;justify-content:space-between;padding:6px 0}.sum s{color:var(--muted);margin-right:6px}
.sum.total{font-weight:800;font-size:1.35rem;border-top:2px solid var(--black);margin-top:10px;padding-top:12px}
.free{color:var(--green);font-weight:700}
.empty{text-align:center;padding:50px 0;color:var(--muted)}.empty h3{color:var(--black);font-size:2rem;margin-bottom:8px}.empty p{margin:0 0 18px}
label{display:block;font-weight:600;margin:14px 0 4px}
input,textarea{width:100%;padding:11px 14px;border:2px solid var(--line);border-radius:0;background:#fff;font:inherit;color:var(--black)}
textarea{min-height:96px;resize:vertical}input:focus,textarea:focus{border-color:var(--black);outline:0}
.err{color:var(--red);font-size:.88rem;min-height:1.2em;margin-top:2px}
.coupon{display:flex;gap:8px;margin:6px 0 4px}.coupon input{text-transform:uppercase}.coupon .btn{padding:8px 18px}
.cmsg{font-size:.9rem;min-height:1.3em;margin-bottom:8px}.cmsg.ok{color:var(--green);font-weight:600}.cmsg.bad{color:var(--red)}
.nudge,.notice{background:var(--yellow);color:var(--black);padding:11px 14px;font-size:.92rem;font-weight:600;margin-top:10px}
.notice{margin:0 0 14px}
.paynote,.note{font-size:.9rem;color:var(--muted);margin-top:12px}
.chk{display:flex;gap:8px;align-items:center;font-weight:500;margin:10px 0 0}.chk input{width:auto}
.authbox{max-width:480px;margin:34px auto 70px}#accView{margin:30px 0 70px}
.done{text-align:center;max-width:560px;margin:40px auto 70px}.done .big{font-size:3.4rem}.done h2{margin:8px 0;font-size:2.6rem}.box{text-align:left;margin-top:20px}
.order{border:2px solid var(--black);padding:14px;margin-bottom:12px}
.ohead{display:flex;justify-content:space-between;gap:10px}.ohead span,.oaddr{color:var(--muted);font-size:.9rem}.ototal{font-weight:800;font-size:1.2rem}
.oitems{margin:10px 0;padding:10px 0;border-block:1px dashed var(--line)}
.pill{display:inline-block;background:var(--yellow);font-weight:800;font-size:.8rem;padding:2px 10px;margin-top:6px;text-transform:uppercase}
.det div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.det div:last-child{border:0}.det span{color:var(--muted)}.det b{text-align:right;word-break:break-word}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.doc{max-width:760px;margin:0 auto;padding:44px 0 70px}.doc h2{font-size:1.7rem;margin:30px 0 8px}.doc p,.doc li{color:#333}.doc ul{padding-left:22px}.doc li{margin:4px 0}.doc .upd{color:var(--muted)}
.doc a,.note a{text-decoration:underline;font-weight:600}
footer{background:var(--black);color:#bbb;padding:34px 0;font-size:.92rem}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
footer a{color:var(--yellow);text-decoration:underline}
@media(max-width:760px){.cols{grid-template-columns:1fr}.cols.even{grid-template-columns:1fr}}
.cols.even{grid-template-columns:1fr 1fr}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><div class="wrap"><a class="logo" href="index.html">Streezier</a>
<form class="sform" id="sform" role="search"><input id="q" type="search" placeholder="Search Streezier" aria-label="Search products"><button type="submit">Search</button></form>
<nav><a href="index.html" class="">About</a><a href="home.html" class="on">Shop</a><a href="profile.html" class="">Account</a><a href="cart.html" class="">Cart<span class="badge" id="count" hidden>0</span></a></nav></div></header>
<main class="wrap">
<div id="listView">
<div class="pagehead"><h1>Shop</h1><p>The Streezier collection</p></div>
<div class="catbar" id="catbar"></div>
<div class="head"><h2 id="res"></h2><div class="sorts" id="sorts"><button class="chip" data-s="lo">Price: Low to High</button><button class="chip" data-s="hi">Price: High to Low</button></div></div>
<div class="grid" id="grid"></div>
</div>
<div id="detailView" hidden></div>
</main>
<footer><div class="wrap"><div><strong style="color:#fff">STREEZIER</strong> · WE TRUST QUALITY NOTHING MORE<br>© 2026 Streezier. All rights reserved.</div><div><a href="privacy.html">Privacy Policy</a> · <a href="mailto:support.streezier@gmail.com">support.streezier@gmail.com</a></div></div></footer>
<script>
/* ============ HOW TO ADD A PRODUCT ============
   Copy the template block inside the PRODUCTS list, paste it below the END OF TEMPLATE line
   (before the closing ];), remove nothing else, and change the values:
     id          a unique number (1, 2, 3 ... never repeat)
     name        product title
     category    any word you like (for example "Bags"). Category buttons appear automatically.
     price       selling price in Rs. (numbers only)
     mrp         original price (optional, shows a discount; delete the line if not needed)
     images      photo file names inside your "images" folder
     emoji, bg   shown only if a photo is missing (bg = background color)
     description a short paragraph about the product
     highlights  key points, each in quotes, separated by commas
   Put a comma after every product block except the last one.
================================================= */
const PRODUCTS=[
/* ---- TEMPLATE (copy this block) ----
{
 id:1,
 name:"Product name",
 category:"Category",
 price:4999,
 mrp:5999,
 images:["images/product1_1.jpg","images/product1_2.jpg"],
 emoji:"🖤",
 bg:"#f4f4f2",
 description:"Write a short paragraph about the product here.",
 highlights:["First key point","Second key point","Third key point"]
},
---- END OF TEMPLATE ---- */
];

/* If a photo is not found, try other common file names before showing the emoji. */
const EXTS=["jpg","jpeg","png","webp","JPG","JPEG","PNG"];
function photoVariants(src){
 const m=src.match(/^(.*\/)?([^\/]+?)(\.[A-Za-z0-9]+)?$/),dir=m[1]||"",base=m[2],out=[];
 [dir,""].forEach(d=>EXTS.forEach(e=>{const v=d+base+"."+e;if(v!==src&&!out.includes(v))out.push(v)}));
 out.push(src+".jpg",src+".png");
 return out;
}
window.imgFail=function(img,emoji){
 const orig=img.dataset.orig||(img.dataset.orig=img.getAttribute("src")),i=+(img.dataset.i||0),v=photoVariants(orig);
 if(i<v.length){img.dataset.i=i+1;img.src=v[i]}else img.replaceWith(emoji);
};

const $=s=>document.querySelector(s);
const money=n=>"Rs. "+Number(n).toLocaleString("en-IN");
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const imgs=p=>p.images||(p.image?[p.image]:[]);
const em=p=>p.emoji||"🖤";
const pic=(u,p)=>`<img src="${esc(u)}" alt="${esc(p.name)}" onerror="imgFail(this,'${em(p)}')">`;
const media=p=>imgs(p)[0]?pic(imgs(p)[0],p):em(p);
const S={q:"",c:"All",sort:""};let CUR=null;
const KEY="streezier_cart";
let cart={};try{cart=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
function saveCart(){try{localStorage.setItem(KEY,JSON.stringify(cart))}catch(e){}count()}
function count(){const n=Object.values(cart).reduce((a,b)=>a+b.qty,0),b=$("#count");b.textContent=n;b.hidden=!n}
function addToCart(id){
 const p=PRODUCTS.find(x=>String(x.id)===String(id));if(!p)return;
 cart[p.id]=cart[p.id]||{id:p.id,name:p.name,price:p.price,image:imgs(p)[0]||"",emoji:em(p),bg:p.bg||"#f4f4f2",qty:0};
 cart[p.id].qty++;saveCart();
}
const cats=()=>[...new Set(PRODUCTS.map(p=>p.category))];
function renderCats(){
 const c=cats();
 $("#catbar").innerHTML=c.length>1?["All",...c].map(x=>`<button class="chip" data-f="${esc(x)}">${esc(x)}</button>`).join(""):"";
}
function renderList(){
 $("#sorts").hidden=!PRODUCTS.length;
 if(!PRODUCTS.length){
  $("#res").textContent="";
  $("#grid").innerHTML=`<div class="empty" style="grid-column:1/-1"><h3>New collection coming soon</h3><p>We are getting our first Streezier products ready.</p><a class="btn" href="index.html">About Streezier</a></div>`;
  return;
 }
 let l=PRODUCTS.filter(p=>(S.c=="All"||p.category==S.c)&&(p.name+" "+p.category).toLowerCase().includes(S.q.toLowerCase()));
 if(S.sort=="lo")l.sort((a,b)=>a.price-b.price);
 if(S.sort=="hi")l.sort((a,b)=>b.price-a.price);
 $("#res").textContent=`${l.length} product${l.length==1?"":"s"}`+(S.q?` for "${S.q}"`:"")+(S.c!="All"?` in ${S.c}`:"");
 $("#grid").innerHTML=l.length?l.map(p=>`<div class="card" tabindex="0" role="link" data-open="${esc(p.id)}">${p.mrp?`<span class="sale">-${Math.round(100-p.price/p.mrp*100)}%</span>`:""}<div class="thumb" style="background:${p.bg||"#f4f4f2"}">${media(p)}</div><div class="body"><span class="tag">${esc(p.category)}</span><h3>${esc(p.name)}</h3><div class="price">${money(p.price)}${p.mrp?`<span class="mrp">${money(p.mrp)}</span>`:""}</div></div></div>`).join(""):`<div class="empty" style="grid-column:1/-1"><h3>Nothing found</h3><p>Try another word or category.</p></div>`;
 document.querySelectorAll("[data-f]").forEach(b=>b.classList.toggle("on",b.dataset.f==S.c));
 document.querySelectorAll("[data-s]").forEach(b=>b.classList.toggle("on",b.dataset.s==S.sort));
}
function showDetail(p){
 $("#detailView").innerHTML=`<button class="back" data-back>← Back to shop</button><div class="detail"><div><div class="dimg" id="mainImg" style="background:${p.bg||"#f4f4f2"}">${media(p)}</div>${imgs(p).length>1?`<div class="thumbs">${imgs(p).map((u,i)=>`<img src="${esc(u)}" alt="Photo ${i+1}" data-pic="${esc(u)}" onerror="imgFail(this,'')">`).join("")}</div>`:""}</div><div><span class="tag">${esc(p.category)}</span><h1>${esc(p.name)}</h1><div class="dprice">${money(p.price)}${p.mrp?`<span class="mrp">${money(p.mrp)}</span><span class="off">${Math.round(100-p.price/p.mrp*100)}% off</span>`:""}</div><div class="del">Free shipping over Rs. 1499. Delivery fees are added according to your area.</div><p>${esc(p.description||"")}</p><ul>${(p.highlights||[]).map(h=>`<li>${esc(h)}</li>`).join("")}</ul><div class="two"><button class="btn" data-add="${esc(p.id)}">Add to cart</button><button class="btn" data-buy="${esc(p.id)}">Buy now</button></div></div></div>`;
}
function route(){
 const p=CUR!==null&&PRODUCTS.find(x=>String(x.id)===String(CUR));
 $("#listView").hidden=!!p;$("#detailView").hidden=!p;
 p?showDetail(p):renderList();
 window.scrollTo(0,0);
}
$("#sform").onsubmit=e=>{e.preventDefault();S.q=$("#q").value.trim();CUR=null;route()};
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-open],[data-add],[data-buy],[data-back],[data-pic],[data-f],[data-s]");if(!t)return;
 const d=t.dataset;
 if(d.pic!==undefined){const p=PRODUCTS.find(x=>String(x.id)===String(CUR));$("#mainImg").innerHTML=pic(d.pic,p)}
 else if(d.open!==undefined){CUR=d.open;route()}
 else if(d.back!==undefined){CUR=null;route()}
 else if(d.f!==undefined){S.c=d.f;CUR=null;route()}
 else if(d.s!==undefined){S.sort=S.sort==d.s?"":d.s;renderList()}
 else if(d.add!==undefined){addToCart(d.add);t.textContent="Added ✓";setTimeout(()=>t.textContent="Add to cart",1200)}
 else if(d.buy!==undefined){addToCart(d.buy);location.href="cart.html"}
});
document.addEventListener("keydown",e=>{const t=e.target.closest&&e.target.closest("[data-open]");if(t&&e.key=="Enter"){CUR=t.dataset.open;route()}});
const u=new URLSearchParams(location.search);S.q=u.get("q")||"";$("#q").value=S.q;
renderCats();
if(u.get("c")&&cats().includes(u.get("c")))S.c=u.get("c");
count();route();
</script></body></html>
